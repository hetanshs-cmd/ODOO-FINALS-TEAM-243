name: Security Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

jobs:
  # ── Dependency Vulnerability Scan ──────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: false

  # ── Secret Scanning ─────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scan

      - name: Check for .env files committed accidentally
        run: |
          if git diff --name-only HEAD | grep -E "^\.env$|^\.env\." | grep -v "\.example$"; then
            echo "❌ Real .env file detected in commit. Remove it immediately."
            exit 1
          fi
          echo "✅ No .env files found in commit."

      - name: Check for potential secrets in code
        run: |
          if grep -r --include="*.ts" --include="*.tsx" --include="*.js" \
            -E "(password|secret|token|key)\s*=\s*['\"][^'\"]{8,}['\"]" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            .; then
            echo "⚠️  Potential hardcoded secret detected. Review the matches above."
            exit 1
          fi
          echo "✅ No obvious hardcoded secrets found."
